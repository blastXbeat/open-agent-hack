<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Literature Tree</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.45 system-ui, sans-serif; margin: 0; color: #172638; background: #f4f7fa; }
    header { padding: 1rem 1.25rem; background: #0f2744; color: #fff; }
    header p { margin: .35rem 0 0; max-width: 70ch; opacity: .9; }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 5.5rem); }
    aside { padding: 1rem; border-right: 1px solid #dce4ea; background: #fff; overflow: auto; }
    #network { height: calc(100vh - 5.5rem); background: #fff; }
    label, button { display: block; margin: .5rem 0; }
    pre { white-space: pre-wrap; font-size: 12px; background: #f5f8fa; padding: .75rem; }
    .warn { color: #8a1c1c; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } #network { height: 50vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Literature Tree</h1>
    <p>Interactive paper network. Every edge must carry a quoted citation from the corpus or fixture. Credentials stay on the server, not in this page.</p>
  </header>
  <main>
    <aside>
      <label>Load graph JSON
        <input id="file" type="file" accept="application/json">
      </label>
      <p id="meta">No graph loaded.</p>
      <h2>Selected evidence</h2>
      <pre id="evidence">Click an edge.</pre>
    </aside>
    <div id="network"></div>
  </main>
  <script>
    const evidenceEl = document.getElementById("evidence");
    const metaEl = document.getElementById("meta");
    let network;

    function render(graph) {
      const nodes = new vis.DataSet((graph.nodes || []).map((n) => ({
        id: n.id,
        label: n.title || n.id,
        title: [n.title, n.year, n.abstract].filter(Boolean).join(" — ")
      })));
      const edges = new vis.DataSet((graph.edges || []).map((e, i) => ({
        id: "e" + i,
        from: e.from,
        to: e.to,
        label: e.relation,
        arrows: "to",
        evidence: e.evidence || []
      })));
      const warnings = (graph.warnings || []).join("\n");
      metaEl.innerHTML = `<strong>${graph.seed_query || ""}</strong><br>${nodes.length} nodes, ${edges.length} edges` +
        (warnings ? `<div class="warn">${warnings}</div>` : "");
      const container = document.getElementById("network");
      if (network) network.destroy();
      network = new vis.Network(container, { nodes, edges }, {
        physics: { stabilization: true },
        edges: { font: { size: 11, align: "middle" } }
      });
      network.on("selectEdge", (params) => {
        const id = params.edges[0];
        const edge = edges.get(id);
        evidenceEl.textContent = JSON.stringify(edge && edge.evidence, null, 2) || "No evidence";
      });
    }

    document.getElementById("file").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      render(JSON.parse(await file.text()));
    });
  </script>
</body>
</html>
